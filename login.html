<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            background:linear-gradient(135deg,#4facfe,#00f2fe);
        }

        .login-box{
            background:#fff;
            padding:30px;
            border-radius:15px;
            width:350px;
            box-shadow:0 10px 20px rgba(0,0,0,0.2);
            text-align:center;
        }

        .login-box h2{
            margin-bottom:20px;
            color:#333;
        }

        .input-box{
            margin:15px 0;
        }

        .input-box input{
            width:100%;
            padding:12px;
            border:1px solid #ccc;
            border-radius:8px;
            font-size:16px;
        }

        .login-btn{
            width:100%;
            padding:12px;
            background:#4facfe;
            color:white;
            border:none;
            border-radius:8px;
            font-size:16px;
            cursor:pointer;
            transition:0.3s;
        }

        .login-btn:hover{
            background:#007BFF;
        }

        .forgot{
            margin-top:15px;
        }

        .forgot a{
            text-decoration:none;
            color:#007BFF;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>Login</h2>

        <form>
            <div class="input-box">
                <input type="text" placeholder="Enter Username" required>
            </div>

            <div class="input-box">
                <input type="password" placeholder="Enter Password" required>
            </div>

            <button type="submit" class="login-btn">Login</button>

            <div class="forgot">
                <a href="#">Forgot Password?</a>
            </div>
        </form>
    </div>

</body>
</html>
